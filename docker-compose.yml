services:
  # PostgreSQL 17.2 - Main Database
  postgres:
    image: postgres:17.2-alpine
    platform: linux/arm64
    container_name: flashsale-postgres
    environment:
      POSTGRES_USER: flashsale
      POSTGRES_PASSWORD: flashsale123
      POSTGRES_DB: flashsale_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flashsale -d flashsale_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flashsale-network

  # Redis 7.4.1 - Cache + Distributed Lock
  redis:
    image: redis:7.4.1-alpine
    platform: linux/arm64
    container_name: flashsale-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - flashsale-network

  # RabbitMQ 3.13 - Message Queue
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    platform: linux/arm64
    container_name: flashsale-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - flashsale-network

  # Prometheus 3.1.0 - Metrics Collection
  prometheus:
    image: prom/prometheus:v3.1.0
    platform: linux/arm64
    container_name: flashsale-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - flashsale-network
    depends_on:
      - postgres
      - redis
      - rabbitmq

  # Grafana 11.4.0 - Monitoring Dashboard
  grafana:
    image: grafana/grafana:11.4.0
    platform: linux/arm64
    container_name: flashsale-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_SERVER_ROOT_URL: http://localhost:3000
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - flashsale-network
    depends_on:
      - prometheus

  # Redis Exporter — exposes Redis metrics for Prometheus
  redis-exporter:
    image: oliver006/redis_exporter:latest
    platform: linux/arm64
    container_name: flashsale-redis-exporter
    environment:
      REDIS_ADDR: redis://redis:6379
    ports:
      - "9121:9121"
    networks:
      - flashsale-network
    depends_on:
      redis:
        condition: service_healthy

  # Go Backend Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flashsale-app
    environment:
      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: flashsale
      DB_PASSWORD: flashsale123
      DB_NAME: flashsale_db
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # RabbitMQ
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      # Application
      APP_PORT: 8080
      APP_ENV: development
      # Monitoring
      METRICS_PORT: 9100
    ports:
      - "8080:8080"
      - "9100:9100"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - flashsale-network
    restart: unless-stopped

networks:
  flashsale-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
