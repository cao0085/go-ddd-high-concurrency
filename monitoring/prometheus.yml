global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'flashsale-system'
    environment: 'development'

scrape_configs:
  # Go Application — runtime metrics (goroutines, memory, GC, etc.)
  - job_name: 'flashsale-app'
    static_configs:
      - targets: ['app:9100']
        labels:
          service: 'backend'
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Redis — via redis_exporter
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'cache'

  # RabbitMQ — built-in prometheus plugin (port 15692)
  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']
        labels:
          service: 'message-queue'

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
